<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversão de Medidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="cartao">
    <h1>Sistema de Conversão de Medidas</h1>

    <label for="categoria">Categoria</label>
    <select id="categoria"></select>

    <label for="origem">De</label>
    <select id="origem"></select>

    <label for="destino">Para</label>
    <select id="destino"></select>

    <label for="valor">Valor</label>
    <input id="valor" type="text" inputmode="decimal" value="1">

    <button id="inverter" type="button">⇅ Inverter unidades</button>

    <p id="resultado" class="resultado"></p>
</main>

<script src="app.js"></script>
</body>
</html>
